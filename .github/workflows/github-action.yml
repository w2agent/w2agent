name: GitHub Action

on:
  pull_request:
    paths:
      - packages/github-action/**
      - packages/cli/**
      - packages/core/**
      - pnpm-lock.yaml
      - tsconfig.base.json
      - .github/workflows/github-action.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  full:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter w2agent... build

      - name: Install the checked-out CLI
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/w2agent-local"
          mkdir -p "$DIR/core" "$DIR/cli"
          pnpm --dir packages/core pack --pack-destination "$DIR/core"
          pnpm --dir packages/cli pack --pack-destination "$DIR/cli"
          npm install --prefix "$DIR" "$DIR"/core/*.tgz "$DIR"/cli/*.tgz
          echo "$DIR/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check the checked-out CLI is the one on PATH
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          [[ "$(w2agent --version)" == "$VERSION" ]] || { echo "::error::w2agent --version is not $VERSION"; exit 1; }

      - name: Run w2agent action (local)
        id: w2agent
        uses: ./packages/github-action
        with:
          url: https://example.com
          threshold: '0'
          output-dir: .w2agent-test/
          max-pages: '5'

      - name: Verify outputs
        env:
          SCORE: ${{ steps.w2agent.outputs.score }}
          GRADE: ${{ steps.w2agent.outputs.grade }}
          BADGE_URL: ${{ steps.w2agent.outputs.badge-url }}
        shell: bash
        run: |
          echo "score=$SCORE"
          echo "grade=$GRADE"
          echo "badge-url=$BADGE_URL"
          [[ -n "$SCORE" ]] || { echo "ERROR: score output not set"; exit 1; }
          [[ -n "$GRADE" ]] || { echo "ERROR: grade output not set"; exit 1; }
          [[ -n "$BADGE_URL" ]] || { echo "ERROR: badge-url output not set"; exit 1; }

      - name: Verify generated files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          ls -la .w2agent-test/
          [[ -s ".w2agent-test/llms.txt" ]] || { echo "ERROR: .w2agent-test/llms.txt missing or empty"; exit 1; }

  audit-only:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter w2agent... build

      - name: Install the checked-out CLI
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/w2agent-local"
          mkdir -p "$DIR/core" "$DIR/cli"
          pnpm --dir packages/core pack --pack-destination "$DIR/core"
          pnpm --dir packages/cli pack --pack-destination "$DIR/cli"
          npm install --prefix "$DIR" "$DIR"/core/*.tgz "$DIR"/cli/*.tgz
          echo "$DIR/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check the checked-out CLI is the one on PATH
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          [[ "$(w2agent --version)" == "$VERSION" ]] || { echo "::error::w2agent --version is not $VERSION"; exit 1; }

      - name: Run w2agent action (audit only, no generate)
        id: w2agent
        uses: ./packages/github-action
        with:
          url: https://example.com
          threshold: '0'
          generate: 'false'
          output-dir: .w2agent-audit-only/
          max-pages: '5'

      - name: Verify outputs (audit-only)
        env:
          SCORE: ${{ steps.w2agent.outputs.score }}
          GRADE: ${{ steps.w2agent.outputs.grade }}
          BADGE_URL: ${{ steps.w2agent.outputs.badge-url }}
        shell: bash
        run: |
          echo "score=$SCORE"
          echo "grade=$GRADE"
          echo "badge-url=$BADGE_URL"
          [[ -n "$SCORE" ]] || { echo "ERROR: score output not set"; exit 1; }
          [[ -n "$GRADE" ]] || { echo "ERROR: grade output not set"; exit 1; }
          [[ -n "$BADGE_URL" ]] || { echo "ERROR: badge-url output not set"; exit 1; }

      - name: Verify no files generated
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          [[ ! -d ".w2agent-audit-only/" ]] || { echo "ERROR: files generated despite generate:false"; exit 1; }
