name: GitHub Action

on:
  pull_request:
    paths:
      - packages/github-action/**
      - .github/workflows/github-action.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  full:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned CLI version is published
        id: published
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "w2agent@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::w2agent@$VERSION is not on npm yet; skipping the action run."
          fi

      - name: Run w2agent action (local)
        if: steps.published.outputs.published == 'true'
        id: w2agent
        uses: ./packages/github-action
        with:
          url: https://example.com
          threshold: '0'
          output-dir: .w2agent-test/
          max-pages: '5'

      - name: Verify outputs
        if: steps.published.outputs.published == 'true'
        env:
          SCORE: ${{ steps.w2agent.outputs.score }}
          GRADE: ${{ steps.w2agent.outputs.grade }}
          BADGE_URL: ${{ steps.w2agent.outputs.badge-url }}
        shell: bash
        run: |
          echo "score=$SCORE"
          echo "grade=$GRADE"
          echo "badge-url=$BADGE_URL"
          [[ -n "$SCORE" ]] || { echo "ERROR: score output not set"; exit 1; }
          [[ -n "$GRADE" ]] || { echo "ERROR: grade output not set"; exit 1; }
          [[ -n "$BADGE_URL" ]] || { echo "ERROR: badge-url output not set"; exit 1; }

      - name: Verify generated files
        if: steps.published.outputs.published == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          ls -la .w2agent-test/ || { echo "ERROR: no files in output dir"; exit 1; }

  audit-only:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned CLI version is published
        id: published
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "w2agent@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::w2agent@$VERSION is not on npm yet; skipping the action run."
          fi

      - name: Run w2agent action (audit only, no generate)
        if: steps.published.outputs.published == 'true'
        id: w2agent
        uses: ./packages/github-action
        with:
          url: https://example.com
          threshold: '0'
          generate: 'false'
          output-dir: .w2agent-audit-only/
          max-pages: '5'

      - name: Verify outputs (audit-only)
        if: steps.published.outputs.published == 'true'
        env:
          SCORE: ${{ steps.w2agent.outputs.score }}
          GRADE: ${{ steps.w2agent.outputs.grade }}
          BADGE_URL: ${{ steps.w2agent.outputs.badge-url }}
        shell: bash
        run: |
          echo "score=$SCORE"
          echo "grade=$GRADE"
          echo "badge-url=$BADGE_URL"
          [[ -n "$SCORE" ]] || { echo "ERROR: score output not set"; exit 1; }
          [[ -n "$GRADE" ]] || { echo "ERROR: grade output not set"; exit 1; }
          [[ -n "$BADGE_URL" ]] || { echo "ERROR: badge-url output not set"; exit 1; }

      - name: Verify no files generated
        if: steps.published.outputs.published == 'true'
        shell: bash
        run: |
          [[ ! -d ".w2agent-audit-only/" ]] || { echo "ERROR: files generated despite generate:false"; exit 1; }
