name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack
        run: |
          cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/core"
          cd ../cli && pnpm pack --pack-destination "$RUNNER_TEMP/cli"

      - name: Publish @w2agent/core
        run: npm publish "$RUNNER_TEMP"/core/*.tgz --provenance --access public

      - name: Publish w2agent
        run: npm publish "$RUNNER_TEMP"/cli/*.tgz --provenance --access public
