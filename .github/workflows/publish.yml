name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test && pnpm test:agent-surfaces

      - name: Pack
        run: |
          cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/core"
          cd ../cli && pnpm pack --pack-destination "$RUNNER_TEMP/cli"

      - name: Publish new versions
        run: |
          for tgz in "$RUNNER_TEMP"/core/*.tgz "$RUNNER_TEMP"/cli/*.tgz; do
            spec=$(tar -xzOf "$tgz" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); `${p.name}@${p.version}`')
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "$spec is already on npm, skipping"
            else
              npm publish "$tgz" --provenance --access public
            fi
          done
