name: Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/core/src/adapters/**"
      - "packages/core/tests/integration.test.ts"
      - "packages/core/tests/fixtures/platforms/**"
      - "packages/nuxt/**"
      - ".github/workflows/integration-tests.yml"
  workflow_dispatch:

jobs:
  integration:
    name: "${{ matrix.platform }} (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [nextjs, nuxt, astro, docusaurus, wordpress, shopify]
        node: [20, 22]
        include:
          - platform: nextjs
            pattern: 'integration: Next\.js'
          - platform: nuxt
            pattern: "integration: Nuxt"
          - platform: astro
            pattern: "integration: (Astro|negative tests)"
          - platform: docusaurus
            pattern: "integration: Docusaurus"
          - platform: wordpress
            pattern: "integration: WordPress"
          - platform: shopify
            pattern: "integration: Shopify"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter w2agent-core build

      - name: Build Nuxt module
        run: pnpm --filter @w2agent/nuxt build

      - name: Run integration tests
        env:
          PATTERN: ${{ matrix.pattern }}
          NODE_ENV: test
        run: pnpm --filter w2agent-core test:integration --reporter=verbose -t "$PATTERN"

  integration-conformance:
    name: "Conformance (Node 22)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter w2agent-core build

      - name: Build Nuxt module
        run: pnpm --filter @w2agent/nuxt build

      - name: Run conformance tests
        run: 'pnpm --filter w2agent-core test:integration --reporter=verbose -t "integration: conformance"'
        env:
          NODE_ENV: test
