name: 'w2agent Audit & Generate'
description: 'Audit a website for AI agent readiness, post PR comments, and generate agent assets'
branding:
  icon: globe
  color: blue

inputs:
  url:
    description: 'URL to audit'
    required: true
  threshold:
    description: 'Minimum passing score (0–100)'
    required: false
    default: '80'
  output-dir:
    description: 'Directory for generated files'
    required: false
    default: '.w2agent/'
  github-token:
    description: 'Token for PR comments'
    required: false
    default: ${{ github.token }}
  node-version:
    description: 'Node.js version'
    required: false
    default: '20'
  formats:
    description: 'Comma-separated generate formats (llms-txt, robots-txt, schema-org, agent-card, faq, markdown, full, webmcp, all)'
    required: false
    default: 'all'
  max-pages:
    description: 'Maximum pages to scan during audit (also used for generate)'
    required: false
    default: '20'
  generate:
    description: 'Whether to generate agent files (set to false for audit-only)'
    required: false
    default: 'true'

outputs:
  score:
    description: 'Overall audit score (0–100)'
    value: ${{ steps.parse.outputs.score }}
  grade:
    description: 'Audit grade (A–F)'
    value: ${{ steps.parse.outputs.grade }}
  badge-url:
    description: 'URL to the w2agent.dev badge SVG for this site'
    value: ${{ steps.parse.outputs.badge-url }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install w2agent
      shell: bash
      run: npm install -g w2agent

    - name: Run audit
      id: audit
      shell: bash
      env:
        URL: ${{ inputs.url }}
        MAX_PAGES: ${{ inputs.max-pages }}
      run: |
        if ! w2agent audit "$URL" --format json --output /tmp/w2agent-audit.json --depth "$MAX_PAGES"; then
          echo "::error::w2agent audit failed for $URL. Ensure the URL is reachable and w2agent is installed (npm install -g w2agent)."
          exit 1
        fi

    - name: Parse audit results
      id: parse
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        if ! SCORE=$(jq '.overallScore' /tmp/w2agent-audit.json 2>/dev/null) || [[ "$SCORE" == "null" || -z "$SCORE" ]]; then
          echo "::error::Failed to parse audit results — /tmp/w2agent-audit.json is missing, malformed, or lacks overallScore."
          exit 1
        fi
        GRADE=$(jq -r '.grade' /tmp/w2agent-audit.json)
        if [[ "$GRADE" == "null" || -z "$GRADE" ]]; then
          echo "::error::Failed to parse audit grade from /tmp/w2agent-audit.json."
          exit 1
        fi
        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "grade=$GRADE" >> $GITHUB_OUTPUT

        # Derive badge URL — extract hostname via the same logic as w2agent.dev generateSlug()
        # Uses node to match platform's new URL().hostname behavior (strips port, auth, lowercases)
        HOSTNAME=$(node -e "try { const h = new URL(process.env.URL).hostname; process.stdout.write(h) } catch { process.exit(1) }")
        SLUG=$(echo "$HOSTNAME" | sed 's/^www\.//' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')
        echo "badge-url=https://w2agent.dev/api/sites/$SLUG/badge.svg" >> $GITHUB_OUTPUT

        echo "::notice::w2agent audit complete — score: $SCORE/100, grade: $GRADE"

    - name: Post PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/w2agent-audit.json', 'utf8'));
          const emoji = ['A', 'B'].includes(report.grade) ? '✅' : report.grade === 'C' ? '⚠️' : '❌';
          const categories = Array.isArray(report.categories) ? report.categories : [];
          const topIssues = Array.isArray(report.topIssues) ? report.topIssues : [];
          const rows = categories.map(c => `| ${c.name} | ${c.score} |`).join('\n');
          const issues = topIssues.slice(0, 5)
            .map((issue, i) => `${i + 1}. **${issue.message}** (+${issue.pointsIfFixed} pts)`)
            .join('\n');

          // Derive slug for badge and leaderboard link (matches platform generateSlug)
          const reportUrl = report.url || '${{ inputs.url }}';
          const domain = new URL(reportUrl).hostname.replace(/^www\./, '');
          const slug = domain.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          const badgeUrl = `https://w2agent.dev/api/sites/${slug}/badge.svg`;
          const leaderboardUrl = `https://w2agent.dev/leaderboard/${domain}`;

          const body = [
            '<!-- w2agent-audit -->',
            `[![w2agent score](${badgeUrl})](${leaderboardUrl})`,
            '',
            `## ${emoji} w2agent Audit: ${report.overallScore}/100 (${report.grade})`,
            '',
            '| Category | Score |',
            '|----------|-------|',
            rows,
            '',
            '### Top Issues',
            issues || '_No issues found._',
            '',
            `_Audited: ${report.url} · ${new Date(report.timestamp).toUTCString()} · [Full report on w2agent.dev](${leaderboardUrl})_`,
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes('<!-- w2agent-audit -->'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Generate agent assets
      if: github.event_name != 'pull_request' && inputs.generate != 'false'
      shell: bash
      env:
        URL: ${{ inputs.url }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FORMATS: ${{ inputs.formats }}
        MAX_PAGES: ${{ inputs.max-pages }}
      run: |
        w2agent generate "$URL" --output "$OUTPUT_DIR" --format "$FORMATS" --max-pages "$MAX_PAGES"

    - name: Commit generated files
      if: github.event_name == 'push'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore: regenerate w2agent assets'
        file_pattern: ${{ inputs.output-dir }}**
        commit_user_name: github-actions[bot]
        commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

    - name: Check threshold
      shell: bash
      env:
        THRESHOLD: ${{ inputs.threshold }}
      run: |
        SCORE=$(jq '.overallScore' /tmp/w2agent-audit.json)
        if [ "$SCORE" -lt "$THRESHOLD" ]; then
          echo "::error::Audit score $SCORE is below threshold $THRESHOLD"
          exit 1
        fi
        echo "Audit passed: $SCORE >= $THRESHOLD"
